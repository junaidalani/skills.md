for(const n of N){const r=3+Math.min(10,n.deg*.6);x.fillStyle=P[n.c%P.length];x.beginPath();x.arc(n.x,n.y,r,0,7);x.fill();
if(n.planned){x.strokeStyle=fg;x.setLineDash([2,2]);x.beginPath();x.arc(n.x,n.y,r+3,0,7);x.stroke();x.setLineDash([])}
if(n.deg>=5||n===hov||n.planned){x.fillStyle=fg;x.font='11px system-ui';x.fillText(n.label,n.x+r+3,n.y+3)}}}
function loop(){if(t++<600||drag)step();draw();requestAnimationFrame(loop)}loop();
cv.onmousemove=e=>{const m={x:e.clientX,y:e.clientY};if(drag){drag.x=m.x;drag.y=m.y;t=0}hov=null;for(const n of N)if(Math.hypot(n.x-m.x,n.y-m.y)<10)hov=n;
document.getElementById('h').innerHTML=hov?`<b>${hov.label}</b><small>${hov.kind}${hov.planned?' (planned)':''} · ${hov.file}<br>community: ${LB[hov.c]}</small>`:''};
cv.onmousedown=()=>{drag=hov};onmouseup=()=>{drag=null}</script>
